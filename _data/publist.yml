- title: "Molecular Insight into the Pathway to Crystallization of Aluminum"
  image: Molecular.jpg
  description: Body-centered cubic clusters, which usually form during the nucleation of simple fluids, are not observed during the crystallization of Al. Throughout nucleation and growth, Al nuclei are always strongly faceted, in sharp contrast with the spherical crystallites observed for simple fluids. 
  authors: C. Desgranges, J. Delhommelle
