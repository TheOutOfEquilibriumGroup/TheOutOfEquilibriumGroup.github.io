  authors: C. Desgranges, J. Delhommelle
  description: We use molecular simulations to study polymorph selection during the crystallization of charge-stabilized colloidal suspension. By modifying the conditions of crystallization, we invert the stability of two polymorphs and induce the formation of crystallites whose structure is predominantly that of the stable polymorph. 
