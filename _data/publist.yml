- title: "Can Ordered Precursors Promote the Nucleation of Solid Solutions?"
  image: Ordered.jpg
  description: Crystallization often proceeds through successive stages that lead to a gradual increase in organization. Using molecular simulation, we determine the nucleation pathway for solid solutions of copper and gold. We identify a new nucleation mechanism (liquid→𝐿⁢12 precursor→solid solution) involving a chemically ordered intermediate that is more organized than the end product. 
  authors: C. Desgranges, J. Delhommelle
  link:
    url: https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.123.195701
    display: Phys. Rev. Lett. 123, 195701 (2019) 
  highlight: 1

- title: "Crystal nucleation along an entropic pathway: Teaching liquids how to transition"
  image: Entropypath.png
  description: We combine ML with Monte Carlo simulations to study the crystal nucleation process. By taking entropy as a reaction coordinate and using the umbrella sampling technique, we are able to determine the Gibbs free energy profile for the crystal nucleation process. The approach developed here can be readily extended to molecular systems and complex fluids, and is especially promising for the study of entropy-driven processes.
  authors: C. Desgranges, J. Delhommelle
  link:
    url: https://journals.aps.org/pre/abstract/10.1103/PhysRevE.98.063307
    display: Phys. Rev. E 98, 063307 (2018)
  highlight: 1

- title: "Unusual Crystallization Behavior Close to the Glass Transition"
  image: Unusual.png
  description: Using molecular simulations, we shed light on the mechanism underlying crystal nucleation in metal alloys and unravel the interplay between crystal nucleation and glass transition, as the conditions of crystallization lie close to this transition.
  authors: C. Desgranges, J. Delhommelle
  link:
    url: https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.120.115701
    display: Phys. Rev. Lett. 120, 115701 (2018)
  highlight: 1
