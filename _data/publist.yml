- title: "Mini Review: Synergizing Driven Quantum Dynamics, AI, and Quantum Computing for Next-Gen Materials Science"
  image: NextGen.jpg
  description: Recent advances in next-generation materials design leverage synergistic approaches combining AI-driven synthesis, robotics, and quantum computing to accelerate the discovery of quantum materials with enhanced properties and novel functionalities for applications such as quantum batteries, solar cells, and phototransistors.
  authors: O. S. Akanbi, J. P. Shannon, J. Delhommelle, C. Desgranges
  link:
    url: https://pubs.acs.org/doi/full/10.1021/acs.jpclett.5c02390
    display: J. Phys. Chem. Lett. 16, 45 (2025)
  highlight: 1

- title: "Mapping Local Dissipation and Entropy Production in Complex and Active Fluids"
  image: LocalDis.jpg
  description: The work introduces a framework that decomposes global entropy production into local contributions by analyzing heat flows and fluxes, enabling spatial maps of dissipation in driven and active fluids and revealing that local entropy production obeys a local fluctuation theorem with correlations of opposite sign for stochastic and deterministic contributions in active matter.
  authors: C. Desgranges, J. Delhommelle, 
  link:
    url: https://pubs.acs.org/doi/full/10.1021/acs.jpclett.5c02469
    display: J. Phys. Chem. Lett. 16, 11405 (2025)
  highlight: 1

- title: "Deciphering the complexities of crystalline state (s) with molecular simulations"
  image: LocalDis.jpg
  description: Recent computational advances, augmented by machine learning, have enhanced molecular simulations to predict crystal structures, compute free energies and barriers, and visualize nucleation mechanisms, addressing the complex thermodynamic and kinetic interplay in crystallization processes that yield diverse polymorphs and metastable forms.
  authors: C. Desgranges, J. Delhommelle, 
  link:
    url: https://www.nature.com/articles/s42004-025-01667-z
    display: Commun. Chem. 8, 281 (2025)
  highlight: 0

- title: "Advancing the design of gold nanomaterials with machine-learned potentials"
  image: LocalDis.jpg
  description: Gold nanoparticles and nanoclusters have emerged as highly efficient, tailorable catalysts for nanomedicine, sensing, and bioimaging, yet optimizing their structure-function relationship remains challenging due to their dual organic-metallic nature, with DFT offering accuracy at high computational cost and classical simulations enabling broad exploration but relying on often inadequate empirical force fields.
  authors: K. Sajini, C. Desgranges, J. Delhommelle, 
  link:
    url: https://www.nature.com/articles/s42004-025-01667-z
    display: Nano Express 6, 022001 (2025)
  highlight: 0
  
- title: "Accelerated convergence via adiabatic sampling for adsorption and desorption processes"
  image: Convergence1.jpeg
  description: Here, we leverage simulations in an adiabatic statistical ensemble, known as adiabatic grand-isochoric ensemble (μ, V, L) ensemble, to reach equilibrium states with a greater efficiency than its isothermal counterpart, i.e., simulations in the grand-canonical ensemble.
  authors: C. Desgranges, J. Delhommelle
  link:
    url: https://pubs.aip.org/aip/jcp/article-abstract/161/10/104104/3311748/Accelerated-convergence-via-adiabatic-sampling-for?redirectedFrom=fulltext
    display: J. Phys. Chem. 161, 104104 (2024) (Editors' Pick)
  highlight: 1

- title: "Molecular Networking: Statistical Mechanics in the Age of AI and Machine Learning"
  image: Book2.jpeg
  description: This book employs an analogy between social groups and molecular assemblies to introduce statistical mechanics, machine learning, and data science concepts, demonstrating how molecular features, interactions, and "communication" processes—akin to polling and social networking—enable prediction of properties and collective behavior in systems for biological, environmental, and energy applications.
  authors: C. Desgranges, J. Delhommelle
  link:
    url: https://www.taylorfrancis.com/books/mono/10.1201/9781003006411/molecular-networking-jerome-delhommelle-caroline-desgranges
    display: CRC Press, 2024
  highlight: 1

- title: "Microswimmers under the spotlight: interplay between agents with different levels of activity"
  image: Entropyproduction.jpg
  description: Simulations and experiments on light-activated self-propelled colloidal particles reveal how active fluids respond to spatial light patterns, enabling inverse templated assembly via bright regions that deplete particles and templated assembly via dark regions that densify them, with scaling relations for characteristic times, tunable local packing fractions through light intensity modulation, and protocols for creating arbitrarily complex nonequilibrium structures beyond thermodynamic limits.
  authors: C. Desgranges, M. Ferrari, P. M. Chaikin, S. Sacanna, M. E. Tuckerman, J. Delhommelle
  link:
    url: https://pubs.rsc.org/en/content/articlelanding/2023/sm/d3sm00915g/unauth
    display: Soft Matter 19, 7334 (2023)
  highlight: 0

- title: "Designing, synthesizing, and modeling active fluids"
  image: Entropyproduction.jpg
  description: This review covers recent advances in designing, synthesizing, and modeling active fluids at nano- and micro-scales, inspired by biological systems to create biomimetic machines and swimmers, while developing new nonequilibrium physics methods to capture their mechanical, thermodynamic, and emergent properties, paving the way for soft matter robotics.
